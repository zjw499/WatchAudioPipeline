[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-audio-pipeline"
version = "0.1.0"
description = "Local ingestion, transcription, and email delivery for Apple Watch recordings."
requires-python = ">=3.11"
dependencies = [
  "faster-whisper",
  "pydantic-settings>=2.3,<3.0",
]
