[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-audio-pipeline"
version = "0.1.0"
description = "Private ingestion, Groq transcription, and email delivery for Apple Watch recordings."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "groq>=0.31,<1.0",
  "pydantic-settings>=2.3,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]
diarization = [
  "pyannote.audio>=4.0,<5.0",
]
gpu-windows = [
  "nvidia-cublas-cu12>=12.9,<13; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9.10,<10; sys_platform == 'win32'",
]
gemini = [
  "playwright>=1.52,<2.0",
]
local-transcription = [
  "faster-whisper>=1.1,<2.0",
]
